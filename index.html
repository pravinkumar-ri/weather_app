<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>WeatherWave | Modern Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="images/drizzle.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="glass-card">
        <div class="search-wrapper">
            <input type="text" id="cityInput" placeholder="Enter city name..." spellcheck="false">
            <button id="searchBtn"><i class="fas fa-search"></i></button>
            <button id="geoBtnExtra" title="Use my location"><i class="fas fa-location-dot"></i></button>
        </div>

        <div id="weatherContainer" class="weather-display">
            <img src="" alt="weather icon" id="weatherIcon" class="weather-icon">
            <h1 class="temp" id="temperature">--°C</h1>
            <h2 class="city" id="cityName">--</h2>
            <div class="date-time" id="localDateTime">--</div>

            <div class="details-row">
                <div class="metric-card">
                    <i class="fas fa-tint"></i>
                    <div class="metric-info">
                        <p class="metric-value" id="humidityValue">--%</p>
                        <p class="metric-label">Humidity</p>
                    </div>
                </div>
                <div class="metric-card">
                    <i class="fas fa-wind"></i>
                    <div class="metric-info">
                        <p class="metric-value" id="windValue">-- km/h</p>
                        <p class="metric-label">Wind Speed</p>
                    </div>
                </div>
            </div>

            <div class="extra-stats">
                <div class="stat-item">
                    <i class="fas fa-compress-alt"></i>
                    <span><span id="pressure">--</span> hPa</span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-eye"></i>
                    <span><span id="visibility">--</span> km</span>
                </div>
                <div class="stat-item">
                    <i class="fas fa-thermometer-half"></i>
                    <span>Feels <span id="feelsLike">--</span>°C</span>
                </div>
            </div>
        </div>

        <div id="loaderElement" class="loader-container">
            <div class="loader"></div>
            <p>Fetching weather...</p>
        </div>

        <div id="errorMessage" class="error-msg">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="errorText">City not found. Try again!</span>
        </div>

        <div class="footer-note">
            Created with <i class="fas fa-heart" style="color: #ff6b6b;"></i> by <a href="https://github.com/pravinkumar-ri" target="_blank">@ri</a>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
